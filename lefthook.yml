colors: false
output:
  - meta
  - summary
  - failure

pre-commit:
  commands:
    format:
      run: npm run format
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    lint:
      run: lefthook run check

lint:
  parallel: true
  commands:
    check:
      run: npm run lint:check
    format:
      run: npm run format:check
    typecheck:
      run: npm run typecheck

check:
  parallel: true
  commands:
    lint:
      run: lefthook run lint
    test:
      run: npm run test
    build:
      run: npm run pack:check
